<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <title>UniBooks - 10 Outro</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap');

    :root {
      --ink: #1F2933;
      --ink-soft: #4A555F;
      --paper: #FFFFFF;
      --paper-warm: #F7F5F0;
      --line: #D9D4CB;
      --line-strong: #948A76;
      --accent: #1E5C46;
      --accent-soft: #E7F0EA;
      --brand-warm: #C8763F;
      --brand-warm-soft: #FBF0E4;
      --muted: #647079;
      --flag: #A34A2A;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background-color: var(--paper-warm);
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0 13px,
        rgba(148, 138, 118, 0.18) 13px 14px
      );
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .book-frame {
      position: absolute;
      top: 48px;
      bottom: 48px;
      left: 48px;
      right: 48px;
      border: 1px solid var(--line-strong);
      border-radius: 3px;
      opacity: 0.6;
      pointer-events: none;
    }

    .outro-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 32px;
    }

    .outro-title {
      font-family: 'Noto Serif TC', serif;
      font-weight: 700;
      font-size: 88px;
      color: var(--accent);
      line-height: 1.3;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .outro-brand {
      font-family: 'Noto Serif TC', serif;
      font-weight: 700;
      font-size: 32px;
      color: var(--ink);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="book-frame"></div>
  <div class="outro-content">
    <h1 class="outro-title">讓課本在校園裡多活一輪</h1>
    <div class="outro-brand">UniBooks</div>
  </div>
</body>
</html>
